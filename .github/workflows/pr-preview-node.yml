name: Release Preview (Node, reusable)

on:
  workflow_call:
    inputs:
      node_version:
        type: string
        default: "22"
      pnpm_version:
        type: string
        default: ""
    secrets:
      OPENAI_API_KEY:
        required: true

permissions:
  contents: read
  pull-requests: write
  packages: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm_version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: "pnpm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@spacevision-ai"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install release-toolkit (CI-only, not in child repo lockfile)
        run: pnpm add @spacevision-ai/release-toolkit-node --ignore-workspace-root-check
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute release preview (deterministic)
        id: deterministic
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node node_modules/@spacevision-ai/release-toolkit-node/scripts/preview-release.mjs

      - name: Compute AI polish preview
        id: ai
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PREVIEW_NOTES: ${{ steps.deterministic.outputs.notes }}
        run: |
          VERSION="${{ steps.deterministic.outputs.version }}"
          if [ "$VERSION" = "(변경사항 없음)" ]; then
            echo "polished=릴리즈할 새 변경사항이 없어 AI 정제를 생략합니다." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          node node_modules/@spacevision-ai/release-toolkit-core/scripts/polish-release-notes.mjs "$VERSION" --preview > /tmp/polished.txt 2> /tmp/polish-err.log
          set -e

          echo "--- AI polish stderr ---"
          cat /tmp/polish-err.log
          echo "--- end stderr ---"
          POLISHED=$(cat /tmp/polished.txt)

          if [ -z "$POLISHED" ]; then
            POLISHED="AI 정제에 실패했습니다 (폴백: 결정론 노트 참고)."
          fi

          echo "polished<<EOF" >> "$GITHUB_OUTPUT"
          echo "$POLISHED" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Post or update preview comment
        uses: actions/github-script@v7
        with:
          script: |
            const version = `${{ steps.deterministic.outputs.version }}`;
            const deterministicNotes = `${{ steps.deterministic.outputs.notes }}`;
            const aiPolished = `${{ steps.ai.outputs.polished }}`;
            const marker = '<!-- release-preview -->';

            const body = [
              marker,
              `## 🚀 다음 릴리즈 미리보기 — ${version}`,
              '',
              '### 📋 결정론 노트 (`CHANGELOG.md` · git 태그에 그대로 기록)',
              '',
              '```',
              deterministicNotes,
              '```',
              '',
              '### ✨ AI 정제 미리보기 (GitHub Release 페이지 — 참고용)',
              '',
              '> 실제 릴리즈 시점에 AI가 다시 생성하므로 내용이 달라질 수 있습니다.',
              '',
              aiPolished,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
