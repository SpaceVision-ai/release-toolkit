name: "Release (Node)"
description: "Full release flow for Node/pnpm repos — semantic-release, sync, back-merge"

inputs:
  pnpm_version:
    required: false
    default: ""
  node_version:
    required: false
    default: "22"
  run_lint:
    required: false
    default: "false"
  run_test:
    required: false
    default: "false"
  lint_command:
    required: false
    default: "pnpm lint"
  test_command:
    required: false
    default: "pnpm test"
  trigger_deploy_workflow:
    description: "Workflow file to dispatch on main after sync. Empty = skip."
    required: false
    default: ""
  trigger_dev_deploy_workflow:
    description: "Workflow file to dispatch on develop after back-merge. Empty = skip."
    required: false
    default: ""
  github_token:
    required: true
  openai_api_key:
    required: true

runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm_version }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node_version }}
        cache: "pnpm"
        registry-url: "https://npm.pkg.github.com"
        scope: "@spacevision-ai"

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Link release-toolkit from action repository (no install needed)
      shell: bash
      run: |
        mkdir -p node_modules/@spacevision-ai
        ln -sf "$GITHUB_ACTION_PATH/../../packages/node" node_modules/@spacevision-ai/release-toolkit-node
        ln -sf "$GITHUB_ACTION_PATH/../../packages/core" node_modules/@spacevision-ai/release-toolkit-core

    - name: Lint
      if: ${{ inputs.run_lint == 'true' }}
      shell: bash
      env:
        LINT_COMMAND: ${{ inputs.lint_command }}
      run: bash -lc "$LINT_COMMAND"

    - name: Test
      if: ${{ inputs.run_test == 'true' }}
      shell: bash
      env:
        TEST_COMMAND: ${{ inputs.test_command }}
      run: bash -lc "$TEST_COMMAND"

    - name: Strict commit check
      shell: bash
      run: |
        LAST_RELEASE=$(git log --format=%H --grep='^chore(release):' -1 || echo "")
        if [ -z "$LAST_RELEASE" ]; then
          echo "No prior auto-release commit found — skipping strict check (legacy commits)"
        else
          echo "Checking commits in $LAST_RELEASE..HEAD"
          pnpm exec commitlint --from "$LAST_RELEASE" --to HEAD --verbose
        fi

    - name: Configure Git
      shell: bash
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Run semantic-release
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GIT_AUTHOR_NAME: github-actions[bot]
        GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
        GIT_COMMITTER_NAME: github-actions[bot]
        GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        HUSKY: "0"
      run: pnpm exec semantic-release

    - name: Sync release → main
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
        git fetch origin
        git checkout main 2>/dev/null || git checkout -b main origin/main
        git merge origin/release --no-edit
        git push origin main

    - name: Trigger deploy workflow (after main sync)
      if: ${{ inputs.trigger_deploy_workflow != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        DEPLOY_WORKFLOW: ${{ inputs.trigger_deploy_workflow }}
      run: gh workflow run "$DEPLOY_WORKFLOW" --ref main --repo ${{ github.repository }}

    - name: Back-merge main → develop
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        git fetch origin
        git checkout develop 2>/dev/null || git checkout -b develop origin/develop
        git merge origin/main --no-edit
        git push origin develop

    - name: Trigger dev deploy workflow (after develop sync)
      if: ${{ inputs.trigger_dev_deploy_workflow != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        DEV_DEPLOY_WORKFLOW: ${{ inputs.trigger_dev_deploy_workflow }}
      run: gh workflow run "$DEV_DEPLOY_WORKFLOW" --ref develop --repo ${{ github.repository }}
